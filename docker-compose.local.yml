volumes:
  web_backend_db_data:
    name: '${PROJECT_NAME}-web-backend-db-data'
    external: true

  web_backend_staticfiles: {}

  redis_cache:
    driver: local

services:
  db:
    volumes:
      - web_backend_db_data:/var/lib/postgresql/data

  backend:
    volumes:
      - ./packages/webapp-libs/webapp-emails/build/email-renderer/:/app/scripts/runtime/email/renderer:ro
      - ./packages/backend/:/app
      - ./packages/backend/docs:/app/docs
      - ./packages/webapp-libs/webapp-core/src/translations/:/app/translations:ro
      - /app/__pypackages__
      - /app/node_modules
      - /app/cdk.out
      - web_backend_staticfiles:/app/static
    env_file:
      - ./packages/backend/.env
    environment:
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_S3_CUSTOM_DOMAIN: localhost:4566/test-bucket
      AWS_S3_URL_PROTOCOL: "http:"
      WORKERS_EVENT_BUS_NAME: ${PROJECT_NAME}-${ENV_STAGE}-workers
    depends_on:
      - db
      - localstack
      - mailcatcher
      - workers
      - flower

  celery_beat:
    env_file:
      - ./packages/backend/.env

  celery_default:
    command: ["./scripts/runtime/run_local_celery_worker_default.sh"]
    volumes:
      - ./packages/backend/:/app
      - /app/__pypackages__
      - web_backend_staticfiles:/app/static
    env_file:
      - ./packages/backend/.env
    environment:
      AWS_ACCESS_KEY_ID: foo
      AWS_SECRET_ACCESS_KEY: bar
      AWS_DEFAULT_REGION: eu-west-1
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_STORAGE_BUCKET_NAME: test-bucket
      AWS_S3_CUSTOM_DOMAIN: localhost:4566/test-bucket
      AWS_S3_URL_PROTOCOL: "http:"

  workers:
    volumes:
      - ./packages/workers/:/app/packages/workers/
      - /app/packages/workers/node_modules/
      - /app/packages/workers/__pypackages__/
    env_file:
      - .env
      - ./packages/workers/.env
    environment:
      - AWS_ENDPOINT_URL=http://localstack:4566
      - ENV_STAGE=${ENV_STAGE:-}
    depends_on:
      - db
      - mailcatcher
    ports:
      - '${WORKERS_HOST_PORT:-3005}:3005'

  redis:
    volumes:
      - redis_cache:/data

  flower:
    image: '${PROJECT_NAME}/backend'
    command: ['./scripts/runtime/run_local_celery_flower.sh']
    env_file:
      - ./packages/backend/.env
    ports:
      - '${FLOWER_HOST_PORT:-5555}:5555'
    depends_on:
      redis:
        condition: service_healthy

  localstack:
    image: localstack/localstack:2.3.0
    ports:
      - '${LOCALSTACK_HOST_PORT:-4566}:4566'
    environment:
      - SERVICES=s3,serverless,events,cloudformation,ses,secretsmanager
      - DEFAULT_REGION=eu-west-1
      - DEBUG=1
      - LAMBDA_EXECUTOR=docker
      - LAMBDA_REMOTE_DOCKER=true
      - DOCKER_HOST=unix:///var/run/docker.sock
      - AWS_ACCESS_KEY_ID=foo
      - AWS_SECRET_ACCESS_KEY=bar
      - HOST_TMP_FOLDER=/tmp
    volumes:
      - '/tmp/localstack:/tmp/localstack'
      - '/var/run/docker.sock:/var/run/docker.sock'
    privileged: true
    depends_on:
      - db
    links:
      - db

  mailcatcher:
    image: sj26/mailcatcher:v0.9.0
    ports:
      - '${MAILCATCHER_WEB_HOST_PORT:-1080}:1080'
      - '${MAILCATCHER_SMTP_HOST_PORT:-1025}:1025'
    restart: always

  # Fork addition (WhatsApp plan Step 4.6): an optional ngrok tunnel, so Meta's and Shopify's webhooks
  # reach the backend on this machine, at https://<NGROK_DOMAIN>/api/whatsapp/webhook/ and
  # https://<NGROK_DOMAIN>/api/shopify/webhooks/.
  #
  # NGROK_DOMAIN in the root .env is the switch (see .env.shared): `pnpm saas up` names this service
  # when it's set (packages/internal/cli/src/lib/composeServices.ts). The "ngrok" profile keeps Compose
  # from starting it on its own, so with NGROK_DOMAIN empty nothing about the tunnel runs.
  #
  # ngrok's Docker guide: https://ngrok.com/docs/using-ngrok-with/docker/
  # The agent's flags (--url replaced the deprecated --domain): https://ngrok.com/docs/agent/cli/
  # Compose profiles: https://docs.docker.com/compose/how-tos/profiles/
  ngrok:
    profiles: ['ngrok']
    # The official image, pinned to an exact version.
    image: ngrok/ngrok:3.39.13-alpine
    # An HTTP tunnel from the static domain to the backend service's own port on Compose's network
    # (5001 inside the container, whatever BACKEND_HOST_PORT maps it to on this machine). The variables
    # default to empty because Compose reads this file on every command; `pnpm saas up` refuses a
    # domain without its authtoken.
    command: ['http', 'backend:5001', '--url=${NGROK_DOMAIN:-}']
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN:-}
    ports:
      # The agent's page listing each request it forwarded, at http://localhost:4040.
      - '${NGROK_INSPECT_HOST_PORT:-4040}:4040'
    # Opens the tunnel only once the backend container has started.
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
